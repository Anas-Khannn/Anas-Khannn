<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Anas Khan — Full-stack engineer</title>
  <desc id="desc">A dark terminal-inspired banner with cyan and violet details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080C12"/>
      <stop offset="0.58" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#151126"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <path d="M0 8A8 8 0 0 1 8 0h1184a8 8 0 0 1 8 8" fill="none" stroke="url(#accent)" stroke-width="3"/>

  <g transform="translate(66 52)">
    <circle cx="0" cy="0" r="6" fill="#FF5F57"/>
    <circle cx="22" cy="0" r="6" fill="#FEBB2E"/>
    <circle cx="44" cy="0" r="6" fill="#28C840"/>
    <text x="76" y="5" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">~/people/anas-khan</text>
  </g>

  <g transform="translate(66 115)">
    <text x="0" y="0" fill="#00E5FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">$ whoami</text>
    <text x="0" y="82" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">ANAS KHAN</text>
    <rect x="0" y="106" width="485" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>
    <text x="0" y="148" fill="#A7B0C0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">FULL-STACK ENGINEER  /  PESHAWAR, PK</text>
  </g>

  <g transform="translate(835 92)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <rect width="295" height="190" rx="14" fill="#0B1018" stroke="#263244"/>
    <text x="24" y="35" fill="#64748B" font-size="13">BUILD_MANIFEST</text>
    <text x="24" y="73" fill="#00E5FF" font-size="16">web</text>
    <text x="98" y="73" fill="#D8DEE9" font-size="16">Next.js + Node</text>
    <text x="24" y="108" fill="#8B5CF6" font-size="16">mobile</text>
    <text x="98" y="108" fill="#D8DEE9" font-size="16">Flutter</text>
    <text x="24" y="143" fill="#22C55E" font-size="16">data</text>
    <text x="98" y="143" fill="#D8DEE9" font-size="16">PostgreSQL</text>
    <text x="24" y="174" fill="#64748B" font-size="13">status:</text>
    <text x="86" y="174" fill="#22C55E" font-size="13">SHIPPING</text>
    <circle cx="263" cy="169" r="5" fill="#22C55E" filter="url(#glow)"/>
  </g>
</svg>
